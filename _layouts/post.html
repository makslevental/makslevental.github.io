---
layout: default
---

<article class="post">
  <h1 style="display: inline-block; font-size: 30px">{{ page.title }}</h1>
  &emsp; <div style="display: inline-block;"class="date">
    {{ page.date | date: "%B %e, %Y" }}
  </div>
  <hr style="clear:both;"/>

  <div class="entry">
    {% include toc.html html=content sanitize=true %}
    {{ content }}
  </div>

</article>
